<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kahani Studio — player</title>
<style>
@font-face{font-family:'NotoDeva';font-weight:600;src:url('../fonts/noto-sans-devanagari-devanagari-600-normal.woff2') format('woff2');unicode-range:U+0900-097F,U+200C-200D,U+20B9,U+25CC}
@font-face{font-family:'NotoDeva';font-weight:600;src:url('../fonts/noto-sans-devanagari-latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D}
@font-face{font-family:'NotoDeva';font-weight:700;src:url('../fonts/noto-sans-devanagari-devanagari-600-normal.woff2') format('woff2');unicode-range:U+0900-097F,U+200C-200D,U+20B9,U+25CC}
html,body{margin:0;height:100%;background:#0b0710;color:#eee;font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
canvas{width:min(100vw,calc((100vh - 70px)*16/9));aspect-ratio:16/9;background:#000;display:block}
#bar{display:flex;gap:10px;align-items:center;width:min(100vw,calc((100vh - 70px)*16/9));font-size:13px}
#bar button{background:#2a1f33;color:#fdebd0;border:1px solid #54406a;border-radius:6px;padding:5px 11px;cursor:pointer}
#scrub{flex:1}
body.export #bar{display:none}body.export #app{gap:0}body.export canvas{width:100vw;height:100vh;aspect-ratio:auto}
</style></head>
<body><div id="app"><canvas id="c"></canvas>
<div id="bar"><button id="play">▶</button><button id="restart">⟲</button><input id="scrub" type="range" min="0" max="1" step="0.01" value="0"><span id="tc"></span><span id="shot" style="opacity:.6"></span><button id="cc">CC</button></div></div>
<script type="module" src="main.js"></script></body></html>

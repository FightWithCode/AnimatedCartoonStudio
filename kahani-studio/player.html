<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kahani Toon Player</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/engine/util.js"></script>
<script src="/engine/paint.js"></script>
<script src="/engine/puppet.js"></script>
<script src="/engine/locations.js"></script>
<script src="/engine/scene.js"></script>
<script>
(async () => {
  try {
    const q = new URLSearchParams(location.search);
    const fonts = [
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-600-normal.woff2', '600'],
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-700-normal.woff2', '700'],
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-800-normal.woff2', '800'],
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-latin-600-normal.woff2', '600'],
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-latin-700-normal.woff2', '700'],
      ['Baloo 2', '/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2', '800'],
    ];
    await Promise.all(fonts.map(([fam, url, w]) => new FontFace(fam, `url(${url})`, { weight: w }).load().then(f => document.fonts.add(f)).catch(() => {})));
    const T = await (await fetch('/project/build/timeline.json', { cache: 'no-store' })).json();
    const scale = +(q.get('scale') || 1);
    const cv = document.getElementById('c');
    cv.width = Math.round(T.width * scale / 2) * 2; cv.height = Math.round(T.height * scale / 2) * 2;
    KT.Scene.init(T, cv, { captions: q.has('captions') ? q.get('captions') === '1' : T.captions !== false, speakerLabels: T.speakerLabels, captionSize: T.captionSize, debug: q.get('debug') === '1' });
    await KT.Scene.preload('/project/');
    window.OUT = [cv.width, cv.height];
    window.TOTAL_FRAMES = KT.Scene.totalFrames();
    window.FPS = T.fps;
    window.SHOT_LIST = T.shots.map(s => ({ id: s.id, start: s.start, end: s.end, location: s.location, framing: s.framing }));
    window.renderFrame = (i) => KT.Scene.render(i);
    window.grab = (i, q) => { KT.Scene.render(i); return cv.toDataURL('image/jpeg', q || 0.93); };
    window.grabCast = () => { KT.Scene.renderCast(); return cv.toDataURL('image/jpeg', 0.93); };
    window.grabSet = (n, t) => { KT.Scene.renderSet(n, t); return cv.toDataURL('image/jpeg', 0.93); };
    window.SETS = Object.keys(KT.SETS);
    window.errors = () => [...KT.Scene.errors];
    window.READY = true;
  } catch (e) { window.BOOT_ERROR = String(e && e.stack || e); }
})();
</script>
</body>
</html>
